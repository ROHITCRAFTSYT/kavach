[project]
name = "kavach"
version = "1.0.0"
description = "Kavach: multilingual scam shield and paperwork explainer built on Sarvam AI"
requires-python = ">=3.12"
dependencies = [
    "sarvamai==0.1.34",
    "fastapi>=0.141,<1.0",
    "uvicorn[standard]>=0.54,<1.0",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14,<4.0",
    "pillow>=12.3,<13.0",
    "httpx>=0.28,<1.0",
    "pydantic>=2.13,<3.0",
    "imageio-ffmpeg>=0.6,<1.0",
]

[tool.vercel]
# Vercel's zero-config FastAPI support: the ASGI app lives in kavach/app.py
entrypoint = "kavach.app:app"

[tool.setuptools]
packages = ["kavach"]
